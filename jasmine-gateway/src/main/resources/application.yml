server:
  port: 8080

spring:
  application:
    name: jasmine-gateway
  profiles:
    default: dev
  config:
    import:
      - optional:nacos:jasmine-observability.yml?refresh=true
      - optional:nacos:jasmine-gateway.yml?refresh=true
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        namespace: ${NACOS_NAMESPACE:dev}
        group: JASMINE
      config:
        namespace: ${NACOS_NAMESPACE:dev}
        group: JASMINE

logging:
  level:
    com.nfu.jasmine: INFO

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8888,http://localhost:5173,http://127.0.0.1:5173,http://localhost}
  security:
    jwt-secret: ${JWT_SECRET:jasmine-dev-jwt-secret-for-local-debug-only-change-me-2026}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
