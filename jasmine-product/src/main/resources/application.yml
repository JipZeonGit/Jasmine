server:
  port: 9102
  shutdown: graceful

spring:
  application:
    name: product-service
  profiles:
    default: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    import:
      - optional:nacos:jasmine-common.yml?refresh=true
      - optional:nacos:jasmine-observability.yml?refresh=true
      - optional:nacos:jasmine-db-common.yml?refresh=true
      - optional:nacos:jasmine-redis-common.yml?refresh=true
      - optional:nacos:jasmine-mq-common.yml?refresh=true
      - optional:nacos:jasmine-product.yml?refresh=true
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        namespace: ${NACOS_NAMESPACE:dev}
        group: JASMINE
      config:
        namespace: ${NACOS_NAMESPACE:dev}
        group: JASMINE
  flyway:
    enabled: ${APP_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true

logging:
  level:
    com.nfu.jasmine: INFO

mybatis-plus:
  mapper-locations: classpath:mapper/cus/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  type-aliases-package: com.nfu.jasmine.flower.model.entity

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: Jasmine 商品服务
