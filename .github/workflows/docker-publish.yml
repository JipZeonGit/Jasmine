name: 构建并发布 Docker 镜像

on:
  push:
    branches:
      - main
      - microservices
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.dockerignore'
      - 'docs/**'
      - 'LICENSE'
      - 'Jasmine.sql'
  workflow_dispatch:
    inputs:
      modules:
        description: '要构建的模块列表（逗号分隔，留空表示全部）'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  backend-base-check:
    uses: ./.github/workflows/backend-ci.yml

  prepare:
    needs: backend-base-check
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      ref_tag: ${{ steps.meta.outputs.ref_tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      modules: ${{ steps.meta.outputs.modules }}
    steps:
      - name: 1. 拉取最新代码
        uses: actions/checkout@v4

      - name: 2. 计算镜像元数据
        id: meta
        shell: bash
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          short_sha=$(echo '${{ github.sha }}' | cut -c1-7)
          ref_name='${{ github.ref_name }}'
          safe_ref=$(echo "$ref_name" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')
          if [ "$safe_ref" = "main" ]; then
            ref_tag="latest"
          else
            ref_tag="${safe_ref}-latest"
          fi

          # 默认全量；workflow_dispatch 传入时可以缩小
          all_modules='["jasmine-schema","jasmine-gateway","jasmine-iam","jasmine-product","jasmine-trade","jasmine-crm","frontend"]'
          input='${{ inputs.modules }}'
          if [ -n "$input" ]; then
            modules=$(echo "$input" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' | jq -R -s -c 'split("\n") | map(select(length>0))')
          else
            modules="$all_modules"
          fi

          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "ref_tag=$ref_tag" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  build-backend:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [jasmine-schema, jasmine-gateway, jasmine-iam, jasmine-product, jasmine-trade, jasmine-crm]
    if: contains(fromJSON(needs.prepare.outputs.modules), matrix.module)
    steps:
      - name: 1. 拉取最新代码
        uses: actions/checkout@v4

      - name: 2. 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 3. 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 4. 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 5. 计算镜像标签
        id: img
        shell: bash
        run: |
          base="ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.module }}"
          tags="${base}:${{ needs.prepare.outputs.ref_tag }},${base}:sha-${{ needs.prepare.outputs.short_sha }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            tags="${tags},${base}:${{ github.ref_name }}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: 6. 构建并推送 ${{ matrix.module }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            MODULE=${{ matrix.module }}
          tags: ${{ steps.img.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,scope=${{ matrix.module }},mode=max

  build-frontend:
    needs: prepare
    runs-on: ubuntu-latest
    if: contains(fromJSON(needs.prepare.outputs.modules), 'frontend')
    steps:
      - name: 1. 拉取最新代码
        uses: actions/checkout@v4

      - name: 2. 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. 计算镜像标签
        id: img
        shell: bash
        run: |
          base="ghcr.io/${{ needs.prepare.outputs.owner }}/jasmine-frontend"
          tags="${base}:${{ needs.prepare.outputs.ref_tag }},${base}:sha-${{ needs.prepare.outputs.short_sha }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            tags="${tags},${base}:${{ github.ref_name }}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: 5. 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ steps.img.outputs.tags }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
