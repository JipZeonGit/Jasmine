name: 构建并发布 Docker 镜像

on:
  push:
    branches: [ "main", "next" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.dockerignore'
      - 'admin/.dockerignore'
      - '.env'
      - '.env.example'
      - 'LICENSE'
      - 'Jasmine.sql'
      - '.idea/**'
      - '.vscode/**'
      - '.agent/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取最新代码
        uses: actions/checkout@v4

      - name: 2. 配置 Java 21 环境
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 3. 赋予 Maven Wrapper 执行权限并编译打包
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: 4. 转换仓库拥有者为小写
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: 5. 计算镜像标签
        id: tags
        shell: bash
        run: |
          ref_name="${GITHUB_REF_NAME}"
          safe_ref=$(echo "$ref_name" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')
          short_sha=$(echo "${GITHUB_SHA}" | cut -c1-7)

          if [ "$safe_ref" = "main" ]; then
            backend_tags="ghcr.io/${{ steps.lower.outputs.owner }}/jasmine-backend:latest,ghcr.io/${{ steps.lower.outputs.owner }}/jasmine-backend:sha-${short_sha}"
            frontend_tags="ghcr.io/${{ steps.lower.outputs.owner }}/jasmine-frontend:latest,ghcr.io/${{ steps.lower.outputs.owner }}/jasmine-frontend:sha-${short_sha}"
          else
            backend_tags="ghcr.io/${{ steps.lower.outputs.owner }}/jasmine-backend:${safe_ref}-latest,ghcr.io/${{ steps.lower.outputs.owner }}/jasmine-backend:${safe_ref}-${short_sha}"
            frontend_tags="ghcr.io/${{ steps.lower.outputs.owner }}/jasmine-frontend:${safe_ref}-latest,ghcr.io/${{ steps.lower.outputs.owner }}/jasmine-frontend:${safe_ref}-${short_sha}"
          fi

          echo "backend_tags=${backend_tags}" >> $GITHUB_OUTPUT
          echo "frontend_tags=${frontend_tags}" >> $GITHUB_OUTPUT

      - name: 6. 登录到 GitHub Packages (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 7. 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.backend_tags }}

      - name: 8. 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./admin
          push: true
          tags: ${{ steps.tags.outputs.frontend_tags }}
