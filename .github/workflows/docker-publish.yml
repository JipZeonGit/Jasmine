name: 构建并发布 Docker 镜像

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.dockerignore'
      - 'admin/.dockerignore'
      - '.env'
      - '.env.example'
      - 'LICENSE'
      - 'Jasmine.sql'
      - '.idea/**'
      - '.vscode/**'
      - '.agent/**'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取最新代码
        uses: actions/checkout@v4

      - name: 2. 配置 Java 21 环境
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 3. 赋予 Maven Wrapper 执行权限并编译打包
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: 4. 转换仓库拥有者为小写
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: 5. 登录到 GitHub Packages (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 6. 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.lower.outputs.owner }}/jasmine-backend:latest

      - name: 7. 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./admin
          push: true
          tags: ghcr.io/${{ steps.lower.outputs.owner }}/jasmine-frontend:latest
