name: 构建并发布 Docker 镜像

on:
  push:
    branches:
      - next
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend-base-check:
    uses: ./.github/workflows/backend-ci.yml

  detect-build-scope:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.scope.outputs.should_build }}

    steps:
      - name: 1. 拉取最新代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 2. 判断本次改动是否需要构建镜像
        id: scope
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            changed_files=$(git diff --name-only HEAD^ HEAD)
          else
            changed_files=$(git ls-files)
          fi

          should_build=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md|.gitignore|.dockerignore|web/.dockerignore|.env|.env.example|LICENSE|Jasmine.sql|.idea/*|.vscode/*|.agent/*)
                ;;
              *)
                should_build=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: [backend-base-check, detect-build-scope]
    if: >
      (github.event_name == 'workflow_dispatch' && needs.detect-build-scope.outputs.should_build == 'true') ||
      (github.event_name == 'push' && needs.detect-build-scope.outputs.should_build == 'true')
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取最新代码
        uses: actions/checkout@v4

      - name: 2. 转换仓库拥有者为小写
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: 3. 计算镜像标签
        id: tags
        shell: bash
        run: |
          ref_name="${GITHUB_REF_NAME}"
          commit_sha="${GITHUB_SHA}"

          safe_ref=$(echo "$ref_name" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')
          short_sha=$(echo "$commit_sha" | cut -c1-7)

          if [ "$safe_ref" = "main" ]; then
            backend_tags="ghcr.io/${{ steps.lower.outputs.owner }}/jasmine-backend:latest,ghcr.io/${{ steps.lower.outputs.owner }}/jasmine-backend:sha-${short_sha}"
            backend_graalvm_tags="ghcr.io/${{ steps.lower.outputs.owner }}/jasmine-backend-graalvm:latest,ghcr.io/${{ steps.lower.outputs.owner }}/jasmine-backend-graalvm:sha-${short_sha}"
            frontend_tags="ghcr.io/${{ steps.lower.outputs.owner }}/jasmine-frontend:latest,ghcr.io/${{ steps.lower.outputs.owner }}/jasmine-frontend:sha-${short_sha}"
          else
            backend_tags="ghcr.io/${{ steps.lower.outputs.owner }}/jasmine-backend:${safe_ref}-latest,ghcr.io/${{ steps.lower.outputs.owner }}/jasmine-backend:${safe_ref}-${short_sha}"
            backend_graalvm_tags="ghcr.io/${{ steps.lower.outputs.owner }}/jasmine-backend-graalvm:${safe_ref}-latest,ghcr.io/${{ steps.lower.outputs.owner }}/jasmine-backend-graalvm:${safe_ref}-${short_sha}"
            frontend_tags="ghcr.io/${{ steps.lower.outputs.owner }}/jasmine-frontend:${safe_ref}-latest,ghcr.io/${{ steps.lower.outputs.owner }}/jasmine-frontend:${safe_ref}-${short_sha}"
          fi

          echo "backend_tags=${backend_tags}" >> $GITHUB_OUTPUT
          echo "backend_graalvm_tags=${backend_graalvm_tags}" >> $GITHUB_OUTPUT
          echo "frontend_tags=${frontend_tags}" >> $GITHUB_OUTPUT

      - name: 4. 登录到 GitHub Packages (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 5. 构建并推送后端镜像 (JVM)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.backend_tags }}
          cache-from: type=gha,scope=backend-jvm
          cache-to: type=gha,scope=backend-jvm,mode=max

      - name: 6. 构建并推送后端镜像 (GraalVM Native Image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.native
          push: true
          tags: ${{ steps.tags.outputs.backend_graalvm_tags }}
          cache-from: type=gha,scope=backend-graalvm
          cache-to: type=gha,scope=backend-graalvm,mode=max

      - name: 7. 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ steps.tags.outputs.frontend_tags }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
