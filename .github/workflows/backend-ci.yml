name: 后端基础检查

on:
  pull_request:
    branches:
      - main
      - next
    paths-ignore:
      - '**.md'
  workflow_call:

permissions:
  contents: read

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置 Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 赋予 Maven Wrapper 执行权限
        run: chmod +x ./mvnw

      - name: 运行后端编译检查
        run: ./mvnw -B clean compile

      - name: 运行快速单元测试
        run: ./mvnw -B test -DskipITs=true

      - name: 运行 Testcontainers 集成测试并打包
        run: ./mvnw -B verify -DskipUTs=true
