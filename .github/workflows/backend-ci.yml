name: 后端基础检查

on:
  pull_request:
    branches:
      - main
      - next
  push:
    branches:
      - next

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置 Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 赋予 Maven Wrapper 执行权限
        run: chmod +x ./mvnw

      - name: 运行后端测试
        run: ./mvnw test
