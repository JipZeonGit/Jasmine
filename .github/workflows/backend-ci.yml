name: Backend CI

on:
  pull_request:
    branches:
      - main
      - next
  push:
    branches:
      - next

permissions:
  contents: read

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x ./mvnw

      - name: Compile backend
        run: ./mvnw -B clean compile

      - name: Run fast unit tests
        run: ./mvnw -B test -DskipITs=true

      - name: Run Testcontainers integration tests and package
        run: ./mvnw -B verify -DskipUTs=true