server:
  port: 9999

spring:
  # 应用名称，为后续升级与模块拆分做基础
  application:
    name: jasmine
  # 默认使用开发环境配置，测试环境由测试类显式指定
  profiles:
    default: dev
  flyway:
    # 数据库迁移统一由 Flyway 接管，已有关联库通过 baseline 接入
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: true

# 自定义应用级配置
app:
  cors:
    # 这里配置跨域白名单，默认放行本地前端开发环境与 Docker Nginx
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8888,http://localhost}
  security:
    # Access Token 默认半小时，可按环境变量覆盖
    jwt-expire-millis: ${JWT_EXPIRE_MILLIS:1800000}
    # Refresh Token 默认七天，可按环境变量覆盖
    jwt-refresh-expire-millis: ${JWT_REFRESH_EXPIRE_MILLIS:604800000}

logging:
  level:
    com.nfu.jasmine: debug

mybatis-plus:
  global-config:
    db-config:
      # 继续保留项目现有的逻辑删除约定
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  type-aliases-package: com.nfu.jasmine.*.entity

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: ${spring.application.name}
    description: Jasmine 单体应用