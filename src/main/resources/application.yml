server:
  port: 9999

spring:
  # 应用名称，为后续升级与模块拆分做基础
  application:
    name: jasmine
  # 默认使用开发环境配置，测试环境由测试类显式指定
  profiles:
    default: dev
  flyway:
    # 数据库迁移统一由 Flyway 接管，已有关联库通过 baseline 接入
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: true
  rabbitmq:
    # 发布确认用于判断 broker 是否真正收到消息，避免业务方误以为“发送成功”。
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

# 自定义应用级配置
app:
  cors:
    # 这里配置跨域白名单，默认放行旧前端 8888、新前端 Vite 5173 和本地同源访问。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8888,http://localhost:5173,http://127.0.0.1:5173,http://localhost}
  security:
    # Access Token 默认半小时，可按环境变量覆盖
    jwt-expire-millis: ${JWT_EXPIRE_MILLIS:1800000}
    # Refresh Token 默认七天，可按环境变量覆盖
    jwt-refresh-expire-millis: ${JWT_REFRESH_EXPIRE_MILLIS:604800000}
  mq:
    # MQ 能力默认按环境决定是否启用，未启用时继续走同步本地逻辑
    enabled: ${APP_MQ_ENABLED:false}
    # 第一版默认启用死信交换机，方便后续排查消费失败消息
    dead-letter-enabled: ${APP_MQ_DLX_ENABLED:true}
    # 消费幂等键默认保留 24 小时，先覆盖开发联调与短期重复投递场景。
    idempotency-ttl-hours: ${APP_MQ_IDEMPOTENCY_TTL_HOURS:24}
    retry:
      # 默认最多消费 3 次（首次 + 2 次重试），优先兜住瞬时故障。
      max-attempts: ${APP_MQ_RETRY_MAX_ATTEMPTS:3}
      # 退避从 1 秒起步，避免瞬时异常把消费者打成紧密热循环。
      initial-interval-ms: ${APP_MQ_RETRY_INITIAL_INTERVAL_MS:1000}
      multiplier: ${APP_MQ_RETRY_MULTIPLIER:2.0}
      max-interval-ms: ${APP_MQ_RETRY_MAX_INTERVAL_MS:10000}
  idempotency:
    # 创建类写接口默认防重 30 秒，优先拦截双击、浏览器重试和短时重复提交。
    create-ttl-seconds: ${APP_CREATE_IDEMPOTENCY_TTL_SECONDS:30}

logging:
  level:
    com.nfu.jasmine: INFO
    ACCESS_LOG: INFO

mybatis-plus:
  global-config:
    db-config:
      # 继续保留项目现有的逻辑删除约定
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  type-aliases-package: com.nfu.jasmine.*.model.entity

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
    enable:
      jvm: true
      process: true
      system: true
      hikaricp: true
      http: true

info:
  app:
    name: ${spring.application.name}
    description: Jasmine 单体应用
