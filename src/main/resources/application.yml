server:
  port: 9999

spring:
  # 应用名称，为后续升级与模块拆分做基础
  application:
    name: jasmine
  # 默认使用开发环境配置，测试环境由测试类显式指定
  profiles:
    default: dev

# 自定义应用级配置
app:
  cors:
    # 这里配置跨域白名单，默认放行本地前端开发环境与 Docker Nginx
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8888,http://localhost}

logging:
  level:
    com.nfu.jasmine: debug

mybatis-plus:
  global-config:
    db-config:
      # 继续保留项目现有的逻辑删除约定
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  type-aliases-package: com.nfu.jasmine.*.entity
