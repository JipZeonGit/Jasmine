spring:
  datasource:
    # 生产环境不再提供默认值，避免误用开发环境配置
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/jasmine?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Shanghai
  redis:
    # 生产环境 Redis 一律从环境变量注入
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}

app:
  cache:
    # 生产环境继续使用 Redis 缓存
    type: redis
  security:
    # 生产环境必须显式注入 JWT 密钥，不提供默认值
    jwt-secret: ${JWT_SECRET}