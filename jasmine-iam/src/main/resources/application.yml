server:
  port: 9101

spring:
  application:
    name: iam-service
  profiles:
    default: dev
  config:
    import:
      - optional:nacos:jasmine-common.yml?refresh=true
      - optional:nacos:jasmine-observability.yml?refresh=true
      - optional:nacos:jasmine-db-common.yml?refresh=true
      - optional:nacos:jasmine-redis-common.yml?refresh=true
      - optional:nacos:jasmine-mq-common.yml?refresh=true
      - optional:nacos:jasmine-iam.yml?refresh=true
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        namespace: ${NACOS_NAMESPACE:dev}
        group: JASMINE
      config:
        namespace: ${NACOS_NAMESPACE:dev}
        group: JASMINE
  flyway:
    enabled: ${APP_FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: true
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8888,http://localhost:5173,http://127.0.0.1:5173,http://localhost}
  security:
    jwt-expire-millis: ${JWT_EXPIRE_MILLIS:1800000}
    jwt-refresh-expire-millis: ${JWT_REFRESH_EXPIRE_MILLIS:604800000}
    refresh-cookie:
      name: ${JWT_REFRESH_COOKIE_NAME:jasmine_refresh_token}
      secure: ${JWT_REFRESH_COOKIE_SECURE:false}
      same-site: ${JWT_REFRESH_COOKIE_SAME_SITE:Lax}
  mq:
    enabled: ${APP_MQ_ENABLED:false}
    dead-letter-enabled: ${APP_MQ_DLX_ENABLED:true}
    idempotency-ttl-hours: ${APP_MQ_IDEMPOTENCY_TTL_HOURS:24}
    retry:
      max-attempts: ${APP_MQ_RETRY_MAX_ATTEMPTS:3}
      initial-interval-ms: ${APP_MQ_RETRY_INITIAL_INTERVAL_MS:1000}
      multiplier: ${APP_MQ_RETRY_MULTIPLIER:2.0}
      max-interval-ms: ${APP_MQ_RETRY_MAX_INTERVAL_MS:10000}
  outbox:
    relay:
      interval-ms: ${APP_OUTBOX_RELAY_INTERVAL_MS:5000}
      batch-size: ${APP_OUTBOX_RELAY_BATCH_SIZE:50}

logging:
  level:
    com.nfu.jasmine: INFO
    ACCESS_LOG: INFO

mybatis-plus:
  mapper-locations: classpath:mapper/sys/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  type-aliases-package: com.nfu.jasmine.iam.model.entity

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
    enable:
      jvm: true
      process: true
      system: true
      hikaricp: true
      http: true

info:
  app:
    name: ${spring.application.name}
    description: Jasmine 认证鉴权服务
