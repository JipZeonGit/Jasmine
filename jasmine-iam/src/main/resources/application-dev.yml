# 本地开发环境覆盖配置。
# 数据库 / Redis / RabbitMQ 连接信息已迁移到 Nacos 配置中心（jasmine-common.yml + jasmine-iam.yml），
# 此文件仅保留 Nacos 地址覆盖与开发环境特有配置。

spring:
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        namespace: dev
      config:
        namespace: dev

app:
  cache:
    type: memory
  security:
    jwt-secret: ${JWT_SECRET:jasmine-dev-jwt-secret-for-local-debug-only-change-me-2026}
  mq:
    enabled: ${APP_MQ_ENABLED:false}

management:
  health:
    redis:
      enabled: false
