# Nacos 3.0.3 生产环境自定义配置
# 覆盖默认 application.properties 中的认证和兼容性设置

#*************** API 兼容性 (开启 v1 API 以兼容 Spring Cloud Alibaba) ***************#
nacos.core.api.compatibility.client.enabled=true
nacos.core.api.compatibility.admin.enabled=true
nacos.core.api.compatibility.console.enabled=true

#*************** 认证系统 (全部禁用以避免 AccessException bug) ***************#
nacos.core.auth.enabled=false
nacos.core.auth.console.enabled=false
nacos.core.auth.admin.enabled=false
