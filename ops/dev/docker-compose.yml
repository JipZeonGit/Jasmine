# =============================================================================
# 本地开发栈：仅启动中间件，便于在 IDE/CLI 中本地运行业务服务
# - MySQL / Redis / RabbitMQ / Nacos
# - 业务服务（gateway/iam/product/trade/crm）和前端不在本文件中启动，请直接运行
#   或参考 prod 镜像
#
# 使用：
#   1. 复制 ops/.env.example 为 ops/dev/.env 并填好密钥
#   2. cd ops/dev && docker compose up -d
#   3. 在本机以 dev profile 启动业务服务
#      MYSQL_HOST=127.0.0.1 MYSQL_PORT=13306 \
#      REDIS_HOST=127.0.0.1 REDIS_PORT=6379 \
#      RABBITMQ_HOST=127.0.0.1 RABBITMQ_PORT=5673 \
#      NACOS_ADDR=127.0.0.1:8848 NACOS_NAMESPACE=dev \
#      ./mvnw -pl jasmine-iam spring-boot:run
# =============================================================================

services:
  mysql:
    image: mysql:8.4
    container_name: jasmine-dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jasmine}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7.2-alpine
    container_name: jasmine-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:?REDIS_PASSWORD is required} ping | grep PONG || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s

  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: jasmine-dev-rabbitmq
    hostname: jasmine-dev-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/jasmine}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5673}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./logs/rabbitmq:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: jasmine-dev-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      # 本地开发关闭鉴权，方便 import.sh 与服务直连
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    volumes:
      - nacos-data:/home/nacos/data
      - ./logs/nacos:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-data:
