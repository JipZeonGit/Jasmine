version: '3.8'

services:
  # MySQL 数据库服务
  mysql:
    image: mysql:5.7.44
    container_name: jasmine-mysql
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci # 确保中文数据不乱码
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: jasmine
      # 注意：不要在这里设置 MYSQL_USER: root，MySQL 官方镜像禁止创建名为 root 的额外用户
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql # 数据持久化，防止容器重启后数据丢失
      - ./Jasmine.sql:/docker-entrypoint-initdb.d/Jasmine.sql # 首次启动时自动导入初始化SQL脚本
    networks:
      - jasmine-network

  # Redis 缓存服务
  redis:
    image: redis:7.2
    container_name: jasmine-redis
    restart: always
    command: redis-server --requirepass 123456 # 设置 Redis 密码
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data # 持久化
    networks:
      - jasmine-network

  # Spring Boot 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jasmine-backend
    restart: always
    ports:
      - "9999:9999"
    environment:
      # 通过环境变量覆盖 application.yml 中的默认配置
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: 123456
      # CORS跨域配置示例：如果前端Nginx没有部署在默认的 80 端口（如部署在了主机的 8080），请取消注释并按逗号分隔修改下面对应的前端访问地址
      # CORS_ALLOWED_ORIGINS: http://localhost:8080
    depends_on:
      - mysql
      - redis
    networks:
      - jasmine-network

  # Vue 前端服务
  frontend:
    build:
      context: ./vue-admin-template-4.4.0
      dockerfile: Dockerfile
    container_name: jasmine-frontend
    restart: always
    ports:
      - "80:80" # 本地暴露 80 端口，前端页面可以通过 http://localhost 访问
    networks:
      - jasmine-network

networks:
  jasmine-network:
    driver: bridge

volumes:
  mysql-data: # MySQL 数据持久化卷
  redis-data: # Redis 数据持久化卷
