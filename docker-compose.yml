version: '3.8'

# ========================================
# 敏感信息配置说明：
# 本文件通过 ${变量名} 引用同目录下的 .env 文件中的环境变量。
# Docker Compose 启动时会自动读取 .env 文件并注入。
#
# 首次部署步骤：
#   1. 复制 .env.example 为 .env：cp .env.example .env
#   2. 编辑 .env 文件，填入实际的数据库密码等敏感信息
#   3. 执行 docker-compose up -d --build
#
# 注意：.env 文件已被 .gitignore 排除，不会被提交到 Git 仓库，确保密码安全。
# ========================================

services:
  # MySQL 数据库服务
  mysql:
    image: mysql:5.7.44
    container_name: jasmine-mysql
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci # 确保中文数据不乱码
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      # 创建专用的应用连接用户（非 root），MySQL 镜像会自动授予该用户对 MYSQL_DATABASE 的全部权限
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql # 数据持久化，防止容器重启后数据丢失
      - ./Jasmine.sql:/docker-entrypoint-initdb.d/Jasmine.sql # 首次启动时自动导入初始化SQL脚本
    networks:
      - jasmine-network

  # Redis 缓存服务
  redis:
    image: redis:7.2
    container_name: jasmine-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data # 持久化
    networks:
      - jasmine-network

  # Spring Boot 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jasmine-backend
    restart: always
    ports:
      - "9999:9999"
    environment:
      # 通过环境变量覆盖 application.yml 中的默认配置（值从 .env 文件读取）
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # CORS跨域配置：如果前端Nginx没有部署在默认的 80 端口（如部署在了主机的 8080），请在 .env 文件中配置 CORS_ALLOWED_ORIGINS
      # CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      - mysql
      - redis
    networks:
      - jasmine-network

  # Vue 前端服务
  frontend:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: jasmine-frontend
    restart: always
    ports:
      - "80:80" # 本地暴露 80 端口，前端页面可以通过 http://localhost 访问
    networks:
      - jasmine-network

networks:
  jasmine-network:
    driver: bridge

volumes:
  mysql-data: # MySQL 数据持久化卷
  redis-data: # Redis 数据持久化卷
